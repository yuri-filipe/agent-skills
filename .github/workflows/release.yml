name: Release skills
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check release version
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME !== "v"+p.version) process.exit(1)'
      - run: npm run validate
      - run: npm test
      - run: npm run package
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/"$GITHUB_REF_NAME"/* --verify-tag --generate-notes
