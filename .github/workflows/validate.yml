name: Validate skills
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - run: npm run package
      - name: Validate PowerShell entry points
        shell: pwsh
        run: |
          ./scripts/validate.ps1
          ./scripts/install.ps1 -Target All -ProfileRoot (Join-Path $env:RUNNER_TEMP 'skills-smoke')
